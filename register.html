<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Đăng ký tài khoản — Nhạc của tôi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8506a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-badge">✨ TẠO TÀI KHOẢN MỚI</div>
    <h2>📝 Đăng ký Thành viên</h2>
    <p class="sub">Tạo tài khoản để tự động lưu và đồng bộ danh sách <b>❤️ Yêu thích</b> &amp; <b>📁 Playlist cá nhân</b> trên mọi thiết bị.</p>

    <form id="registerForm">
      <label class="field-lbl">Email của bạn
        <input id="regEmail" type="email" placeholder="nhap@email.com" required autocomplete="email">
      </label>
      <label class="field-lbl">Mật khẩu mới
        <input id="regPass" type="password" placeholder="Tối thiểu 6 ký tự" required minlength="6" autocomplete="new-password">
      </label>
      <label class="field-lbl">Nhập lại mật khẩu
        <input id="regPassConfirm" type="password" placeholder="Nhập lại mật khẩu ở trên" required minlength="6" autocomplete="new-password">
      </label>
      <button id="regSubmitBtn" class="primary" type="submit">Đăng ký tài khoản</button>
    </form>

    <div id="msg" role="status"></div>

    <div class="auth-footer">
      <a href="index.html" class="secondary">← Quay về trang Nghe nhạc / Đăng nhập</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script type="module" src="register.js?v=12"></script>
</body>
</html>
