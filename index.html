<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Nhạc của tôi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>🎧 Nhạc của tôi</h1>

  <!-- Bước 1: nhập cấu hình Supabase (chỉ lần đầu trên mỗi thiết bị) -->
  <section id="setup" hidden>
    <p class="sub">Nhập thông tin Supabase. Chỉ lưu trong trình duyệt này, không nằm trong code.</p>
    <form id="setupForm">
      <input id="url" type="url" placeholder="Project URL (https://xxxx.supabase.co)" required autocomplete="off">
      <input id="key" type="password" placeholder="anon / publishable key" required autocomplete="off">
      <button class="primary" type="submit">Lưu</button>
    </form>
  </section>

  <!-- Bước 2: đăng nhập -->
  <section id="login" hidden>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Email" required autocomplete="username">
      <input id="pass" type="password" placeholder="Mật khẩu" required autocomplete="current-password">
      <button class="primary" type="submit">Đăng nhập</button>
    </form>
    <button class="link" id="resetCfg">Đổi cấu hình Supabase</button>
  </section>

  <!-- Bước 3: app -->
  <section id="app" hidden>
    <div class="player">
      <div class="now" id="now">Chưa chọn bài</div>
      <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
      <div class="ctl">
        <button id="shuf" title="Ngẫu nhiên">🔀</button>
        <button id="prev" title="Bài trước">⏮</button>
        <button id="pp" class="big" title="Phát/Dừng">▶</button>
        <button id="next" title="Bài sau">⏭</button>
        <button id="rep" title="Lặp lại">🔁</button>
      </div>
      <div class="vol">🔈<input type="range" id="vol" min="0" max="100" value="80"></div>
    </div>

    <label class="add">＋ Thêm bài hát (mp3, m4a, wav... tối đa 50MB/file)
      <input type="file" id="file" accept="audio/*" multiple hidden>
    </label>

    <ul id="list"></ul>
    <div class="empty" id="empty">Chưa có bài nào.</div>
    <button class="link" id="logout">Đăng xuất</button>
  </section>

  <div id="msg" role="status"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
